    <circle cx="40" cy="18" r="3.5" fill="#facc15"/>
  </g>
  <!-- Text Brand -->
  <text x="105" y="48" font-family="'Montserrat', sans-serif" font-weight="800" font-size="28" fill="#1f1f1f" letter-spacing="1.5">
    AMDG GROUP
  </text>
  <text x="325" y="48" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#007bbf">
    LTD
  </text>
  <text x="106" y="72" font-family="'Bitter', serif" font-weight="500" font-size="13" fill="#64748b" letter-spacing="2">
    CREATING CREATIVITY
  </text>
</svg>
